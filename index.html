<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStack Pro Pricing</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main class="container mx-auto py-12 px-4">
        <div class="text-center m-16">
            <h1 class="text-4xl tracking-normal font-bold">CloudStack Pro Pricing</h1>
        </div>

        <div class="flex flex-col gap-10 md:flex-row justify-center items-center">
            <div class="w-full md:w-72 font-bold bg-gray-900 text-white border border-black-200 rounded-2xl hover:-translate-y-2 transition-transform p-8">
                <h2 class="text-sm font-bold uppercase tracking-widest text-white-1000">Starter</h2>
                <p class="text-3xl font-bold mt-4 text-white-900">Ksh. 2000</p>
                <ul class="mt-6 space-y-4">
                    <li>10GB Storage</li>
                    <li>Basic Support</li>
                    <li>Bonus Feature</li>
                </ul>
            </div>
            <div class="w-full md:w-80 bg-indigo-600 border border-black-200 rounded-2xl hover:-translate-y-2 transition-all p-8 text-white">
                <h2 class="text-4xl font-bold uppercase tracking-widest text-gray-900">Pro</h2>
                <p class="text-3xl font-bold mt-4 text-black">Ksh. 5000</p>
                <ul class="mt-6 space-y-4">
                    <li>Unlimited Storage</li>
                    <li>Priority Support</li>
                    <li>Advanced Analytics</li>
                </ul>
            </div>
            <div class="w-full md:w-72 bg-gray-900 border border-black-200 rounded-lg hover:-translate-y-2 transition-transform p-4 text-white">
                <h2 class="text-sm font-medium text-white uppercase tracking-widest">Enterprise</h2>
                <p class="text-3xl font-bold mt-4 text-white">Ksh. 10000</p>
                <ul class="mt-6 space-y-4">
                    <li>Custom Solution</li>
                    <li>24/7 Phone Support</li>
                    <li class="italic text-gray-400 hidden md:block">Dedicated Manager</li>
                </ul>
            </div>
        </div>
    </main>
    
</body>
</html>
